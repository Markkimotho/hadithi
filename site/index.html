<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20261f" />
    <meta
      name="description"
      content="Four old tales from Ghana, Japan, Germany and Baghdad, retold as first-person games you play in a browser. Free, no account."
    />
    <title>Hadithi · Old tales you can walk into</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/pixelify-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the game</a>
    <main id="main" tabindex="-1">
      <p class="loading">Hadithi</p>
    </main>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-body"></div>
      <button id="close-modal" class="dialog-close" aria-label="Close dialog">×</button>
    </dialog>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <noscript><p class="loading">Hadithi needs JavaScript to play. Enable it and reload this page.</p></noscript>
  </body>
</html>
